server:
  port: 8081 # 预约服务专属端口

spring:
  application:
    name: equipment-reservation # 微服务名称

  # 【核心修复点】这里必须缩进在 spring 下面
  config:
    import: "optional:nacos:equipment-reservation.yml"

  # Nacos 配置，同样必须缩进在 spring 下面
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # Nacos 注册中心地址
      config:
        server-addr: 127.0.0.1:8848 # Nacos 配置中心地址

  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/equipment_reservation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: 453501925

  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

# MyBatis-Plus 配置 (属于顶级节点，不需要缩进)
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 方便调试